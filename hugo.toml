baseURL = "https://soilsutra.com/"
title = "SoilSutra"
locale = "en"
defaultContentLanguage = "en"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true

[params]
  tagline = "Vermicompost facts you can check"
  description = "Plain-language vermicompost guides. Every sentence links to its source and the exact words we relied on."
  # Email sign-up: put the form address from your email service here (see README). Empty = the sign-up block is hidden.
  signupAction = ""
  # A public contact address, shown in the footer and on the About page. Empty = not shown.
  contactEmail = ""

[menus]
  [[menus.main]]
    name = "Guides"
    url = "/articles/"
    weight = 1
  [[menus.main]]
    name = "How we check"
    url = "/how-we-check/"
    weight = 2
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 3

[markup.goldmark.renderer]
  unsafe = false

[minify]
  minifyOutput = true
