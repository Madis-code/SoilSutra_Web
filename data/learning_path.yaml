      hi: "सिस्टम चुनना, बिछावन और जगह तैयार करना, और अपना पहला बैच शुरू करना।"
    topics:
      - key: system-types
        title: { en: "Choosing a system: bins, beds and flow-through", hi: "सिस्टम चुनना: डिब्बे, बेड और फ़्लो-थ्रू" }
      - key: bedding
        title: { en: "Bedding", hi: "बिछावन" }
      - key: site-and-climate
        title: { en: "Site, shade and climate", hi: "जगह, छाँव और जलवायु" }
      - key: first-batch
        title: { en: "Starting your first batch", hi: "अपना पहला बैच शुरू करना" }

