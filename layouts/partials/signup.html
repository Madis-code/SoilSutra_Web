{{ with site.Params.signupAction }}
<section class="signup" aria-labelledby="signup-h">
  <h2 id="signup-h">Get new guides by email</h2>
  <p>One short email when a new guide is ready. No other mail.</p>
  <form action="{{ . }}" method="post">
    <label class="visually-hidden" for="email" style="position:absolute;left:-9999px">Email address</label>
    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <button type="submit">Send me new guides</button>
  </form>
</section>
{{ end }}
