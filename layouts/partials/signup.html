{{ with site.Params.signupAction }}
<section class="signup" aria-labelledby="signup-h">
  <h2 id="signup-h">{{ i18n "signup_title" }}</h2>
  <p>{{ i18n "signup_text" }}</p>
  <form action="{{ . }}" method="post">
    <label class="visually-hidden" for="email" style="position:absolute;left:-9999px">{{ i18n "signup_label" }}</label>
    <input id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
    <button type="submit">{{ i18n "signup_button" }}</button>
  </form>
</section>
{{ end }}
